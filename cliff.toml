# git-cliff 变更日志配置：发布工作流用 --latest 生成当前标签的分类说明。
# 官方参考文档: https://git-cliff.org/docs/configuration

[changelog]
header = """
# 更新日志 (Changelog)

本项目所有显著的版本变更均记录于此文档中。
格式遵循 [Keep a Changelog](https://keepachangelog.com/zh-CN/1.0.0/) 规范。
\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [未发布]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
sort_commits = "newest"

commit_parsers = [
    { message = "^.*\\(security\\):", group = "安全修复 (Security)" },
    { message = "^security", group = "安全修复 (Security)" },
    { body = ".*security", group = "安全修复 (Security)" },
    { message = "^feat", group = "新增功能 (Features)" },
    { message = "^fix", group = "缺陷修复 (Bug Fixes)" },
    { message = "^perf", group = "性能优化 (Performance)" },
    { message = "^refactor", group = "代码重构 (Refactor)" },
    { message = "^doc", group = "文档更新 (Documentation)" },
    { message = "^style", group = "格式样式 (Style)" },
    { message = "^revert", group = "版本回滚 (Reverts)" },
    { message = "^test", group = "测试相关 (Tests)" },
    { message = "^chore\\(release\\):", skip = true },
    { message = "^chore\\(deps.*\\)", skip = true },
    { message = "^chore\\(pr.*\\)", skip = true },
    { message = "^chore\\(packaging\\):", group = "系统打包 (Packaging)" },
    { message = "^ci", group = "流水线配置 (CI/CD)" },
    { message = "^chore", group = "工程维护 (Maintenance)" },
    { message = ".*", group = "其他变动 (Other Changes)" },
]
