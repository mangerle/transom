[package]
name = "transom"
# 这行同时是 DEB 控制元数据的 Description 首行：cargo-deb 会对它折行，超宽会把
# 句子中间切断、折出来的缩进混进长描述。Debian 惯例是摘要行保持单行短句，
# 细节写进 extended-description。全仓库无人读取 CARGO_PKG_DESCRIPTION（关于页
# 用 APP_NAME/APP_VERSION 常量），所以缩短不影响界面文案。
description = "Native SSH, serial console and terminal workspace with SFTP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
publish.workspace = true

[dependencies]
transom-platform.workspace = true
transom-core.workspace = true
transom-net.workspace = true
transom-container.workspace = true
transom-zmodem.workspace = true
transom-sync.workspace = true
transom-store.workspace = true
transom-git.workspace = true
transom-updater.workspace = true
parking_lot.workspace = true
transom-ui.workspace = true
tokio.workspace = true
flume.workspace = true
async-trait.workspace = true
anyhow.workspace = true
log.workspace = true
# `exec:` 深链载荷用 JSON 承载 argv：参数里可能出现空格、引号与换行，
# 行分隔的朴素编码无法无损表达。
serde_json.workspace = true
serde.workspace = true
uuid.workspace = true
fern.workspace = true
# 日志时间戳格式化；工作区内已有同一版本，不新增编译单元。
chrono.workspace = true
portable-pty.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# DEB 打包元数据（cargo-deb）。设计原理（Why）：
# - 依赖表按本机 `ldd` 与 `dpkg -S` 实测手写而不是 `$auto`/dpkg-shlibdeps：
#   后两者把出包结果绑到构建机的包库状态上，同一份代码在不同 Ubuntu 版本
#   会得到不同的 Depends，不可复现；手写清单换 gpui 大版本时需同步，代价
#   是可控的（`packaging/linux/deb/README.md` 记了复核命令）。
# - 只装二进制、桌面条目与矢量图标，不写任何系统级默认程序配置：是否成为
#   默认终端由应用内"桌面集成"开关决定，与"不静默抢占既有工作流"的口径
#   一致，也避免影响同一台机器上的其他用户。
# - Exec 用裸命令名 `transom`（包安装到 /usr/bin 即在 PATH），与用户级注册
#   写绝对路径互不冲突：两者解析到同一个可执行文件。
[package.metadata.deb]
maintainer = "wangle <wangle@agree.com.cn>"
copyright = "2026, wangle <wangle@agree.com.cn>"
license-file = ["../../LICENSE", "4"]
section = "utils"
priority = "optional"
# 修订号固定为空：Debian 的 -N 用于同一上游版本的多次打包修订，本项目每个
# 版本只出一次 GitHub Release 附件，版本号统一取自 workspace，产物名不应多
# 出 -1 后缀；cargo-deb 默认会补 -1，必须显式清空。
revision = ""
# Debian 规范的 changelog：cargo-deb 读取纯文本、自动 gzip 为
# /usr/share/doc/transom/changelog.Debian.gz，apt 与 lintian 都按它核对发行记录。
# 发版时向文件头部追加一条记录，版本号必须与 workspace 版本一致。
changelog = "../../packaging/linux/deb/changelog"
# amd64 由构建机架构自动写入，无需在此固定以免交叉编译时出错。
depends = "libc6, libgcc-s1, libxcb1, libxcb-xkb1, libxkbcommon0, libxkbcommon-x11-0, libxau6, libxdmcp6, hicolor-icon-theme"
extended-description = """\
Transom is a native desktop terminal workspace built on GPUI: SSH and
serial-console sessions, a tabbed/paneled terminal with SFTP file transfer
side-by-side, snippet library, command history, port forwarding and audit
logging."""
assets = [
    # 二进制：cargo-deb 用这个前缀识别需要编译的目标，切勿改成实际路径。
    ["target/release/transom", "usr/bin/transom", "755"],
    ["../../packaging/linux/com.github.mangerle.transom.desktop", "usr/share/applications/com.github.mangerle.transom.desktop", "644"],
    # 图标只随一份 SVG 进 hicolor 主题的 scalable 目录：主题名与 .desktop 的
    # Icon 键（com.github.mangerle.transom）逐字对应，桌面环境按目标尺寸
    # 矢量出图，任何 DPI 都不会出现放大颗粒感。
    ["../../logo/transom-logo.svg", "usr/share/icons/hicolor/scalable/apps/com.github.mangerle.transom.svg", "644"],
    # 手册页：cargo-deb 会把 usr/share/man/ 下的资产自动 gzip 为 transom.1.gz
    # （Debian 策略要求 man 页压缩存放），因此源文件保持纯文本即可。
    ["../../packaging/linux/deb/transom.1", "usr/share/man/man1/transom.1", "644"],
    # AppStream 元数据：软件中心据此展示应用；id 与桌面条目、图标名逐字一致，
    # 校验命令记录在 packaging/linux/deb/README.md。
    ["../../packaging/linux/com.github.mangerle.transom.metainfo.xml", "usr/share/metainfo/com.github.mangerle.transom.metainfo.xml", "644"],
    ["../../README.md", "usr/share/doc/transom/README.md", "644"],
    # JetBrains Mono 以 OFL 1.1 分发；字体已编入二进制，这里单独携带版权与
    # 许可证正文，满足再分发时随每份副本提供许可证的要求。
    ["../../crates/transom-ui/assets/fonts/jetbrains-mono/OFL.txt", "usr/share/doc/transom/fonts/JetBrainsMono-OFL.txt", "644"],
]
maintainer-scripts = "../../packaging/linux/deb"

# cargo-packager 元数据：Windows NSIS、macOS .app/.dmg 与 Linux AppImage 共用。
# DEB 仍由上面的 cargo-deb 段维护，两者字段口径不同，刻意不强行合并。
[package.metadata.packager]
product-name = "Transom"
identifier = "com.github.mangerle.transom"
category = "Utility"
description = "Native SSH, serial console and terminal workspace with SFTP"
long-description = "Transom 是一款基于 GPUI 的原生终端工作台，支持 SSH、串口、分屏终端、SFTP 文件传输、命令历史、端口转发与审计录像。"
# Linux AppImage、Windows NSIS 与 macOS .app 都登记 `ssh://` 候选处理程序。
# macOS 写入 CFBundleURLTypes；NSIS 在每用户安装作用域登记 URL Protocol。
# 是否成为系统默认仍由用户的操作系统设置决定。
# cargo-packager 的 BundleTypeRole 按 camelCase 反序列化，role 必须写小写 viewer。
deep-link-protocols = [
    { schemes = ["ssh"], name = "SSH URL", role = "viewer" },
]
icons = [
    "../../packaging/icons/32x32.png",
    "../../packaging/icons/64x64.png",
    "../../packaging/icons/128x128.png",
    "../../packaging/icons/256x256.png",
    "../../packaging/icons/512x512.png",
    "../../packaging/icons/512x512@2x.png",
    "../../packaging/icons/icon.ico",
]
resources = [
    { src = "../../LICENSE", target = "licenses/LICENSE" },
    { src = "../../README.md", target = "licenses/README.md" },
    { src = "../../crates/transom-ui/assets/fonts/jetbrains-mono/OFL.txt", target = "licenses/JetBrainsMono-OFL.txt" },
]

[package.metadata.packager.windows]
digest-algorithm = "sha256"

[package.metadata.packager.macos]
# 与 CI 的 macos-latest 运行环境保持一致；GPUI/wgpu 依赖的系统框架在 11.0 起可用。
minimum-system-version = "11.0"

[package.metadata.packager.nsis]
# 每用户安装，更新时无需 UAC；安装器图标与窗口图标同源。
installMode = "currentUser"
installer-icon = "../../packaging/icons/icon.ico"
