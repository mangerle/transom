    zh-CN: 界面主题与终端配色的明暗模式相反，观感可能突兀，可在下方"终端配色"中选一套明暗一致的主题。
  font_group:
    en: Font
    zh-CN: 字体
  cursor_group:
    en: Cursor & Scrolling
    zh-CN: 光标与滚动
  window_appearance_group:
    en: Window Appearance
    zh-CN: 窗口外观
  window_background:
    en: Window Background
    zh-CN: 窗口背景
  window_background_desc:
    en: See the desktop through the window, or the blurred desktop.
    zh-CN: 透出桌面本身，或透出模糊后的桌面。
  window_bg_transparent:
    en: Transparent
    zh-CN: 半透明
  window_bg_blurred:
    en: Blurred
    zh-CN: 毛玻璃
  window_transparency:
    en: Window Transparency
    zh-CN: 窗口透明度
  window_transparency_desc:
    en: Fade the whole window; 0% is fully opaque, 100% is fully transparent.
    zh-CN: 整扇窗口一起变透明，0% 为完全不透明，100% 为完全透明。
  highlight_group:
    en: Keyword Highlight
    zh-CN: 关键词高亮
  trigger_group:
    en: Terminal Triggers & Auto-Responses
    zh-CN: 终端触发器与自动应答
  mouse_group:
    en: Mouse
    zh-CN: 鼠标
  selection_group:
    en: Selection
    zh-CN: 选中与分词
  clipboard_group:
    en: Clipboard
    zh-CN: 剪贴板
  tabs_group:
    en: Tabs
    zh-CN: 标签页
  window_group:
    en: Window & Sessions
    zh-CN: 窗口与会话
  language_group:
    en: Language
    zh-CN: 语言
  notify_group:
    en: Notification & Sound
    zh-CN: 通知与声音
  proxy_group:
    en: Outbound Proxy
    zh-CN: 出站代理
  block_view_group:
    en: Semantic Blocks
    zh-CN: 语义块
  key_bindings_group:
    en: Custom Key Mappings
    zh-CN: 自定义按键映射
  key_bindings_desc:
    en: One mapping per line as `keys = sequence`. App shortcuts take precedence when a combination conflicts.
    zh-CN: 每行一条 `按键 = 转义序列`；与应用快捷键冲突时以应用快捷键为准。
  key_bindings_hint:
    en: 'Example: ctrl-shift-left = \e[1;6D. Supported escapes: \e, \x1b, \n, \r, \t, \\, \0, \u{...}.'
    zh-CN: 示例：ctrl-shift-left = \e[1;6D。支持转义：\e、\x1b、\n、\r、\t、\\、\0、\u{...}。
  block_view_enable:
    en: Enable semantic block view
    zh-CN: 启用语义块视图
  block_view_enable_desc:
    en: Collapse long outputs into status banners based on OSC 133 markers; the underlying terminal grid is unchanged.
    zh-CN: 依据 OSC 133 标记把长输出折叠为状态横幅；底层仍是标准字符网格，不影响 vim/tmux。
  block_view_style:
    en: Block appearance
    zh-CN: 块外观样式
  block_view_card:
    en: Card
    zh-CN: 现代卡片
  block_view_minimal:
    en: Minimal
    zh-CN: 极简边缘线
  block_view_rows:
    en: Auto-collapse threshold (rows, 0 disables)
    zh-CN: 自动折叠阈值（行数，0 表示不折叠）
  block_view_rows_hint:
    en: Outputs longer than this are folded into a banner. Changes apply to open panes immediately.
    zh-CN: 输出超过该行数时自动折叠为横幅；保存后立即作用于已打开窗格。
  shell_integration_enable:
    en: Auto-install shell integration
    zh-CN: 自动注入 Shell 集成
  shell_integration_enable_desc:
    en: Detect the remote login shell with an invisible OSC probe, then install OSC 133 command markers for block view, prompt navigation and failure marks. Nothing is written once you have typed in the session.
    zh-CN: 先用一条不产生任何屏幕输出的 OSC 探针探测远端登录 Shell，再安装 OSC 133 命令标记，为语义块、提示符跳转与失败标记提供数据。本轮只在会话结束前尝试一次；只要你已经亲自敲过键就不再写入。
  proxy_mode:
    en: Proxy protocol
    zh-CN: 代理协议
  proxy_mode_desc:
    en: Used by sessions that follow the global setting. SOCKS5 resolves target names remotely; HTTP uses CONNECT tunnels.
    zh-CN: 供"跟随全局"的会话使用；SOCKS5 由代理远端解析目标域名，HTTP 走 CONNECT 隧道。
  proxy_username_hint:
    en: Leave blank for no authentication
    zh-CN: 留空表示不启用认证
  proxy_password_hint:
    en: Leave blank for no authentication
    zh-CN: 留空表示不启用认证
  proxy_host:
    en: Proxy host
    zh-CN: 代理地址
  proxy_port:
    en: Proxy port
    zh-CN: 代理端口
  proxy_username:
    en: Proxy username
    zh-CN: 代理用户名
  proxy_password:
    en: Proxy password
    zh-CN: 代理密码
  proxy_auth_hint:
    en: Leave username and password blank to connect without proxy authentication.
    zh-CN: 用户名与密码都留空时不启用代理认证。
  desktop_integration_group:
    en: Desktop Integration
    zh-CN: 桌面集成
  backup_group:
    en: Data Backup
    zh-CN: 数据备份
  sync_group:
    en: Cloud Sync
    zh-CN: 云同步
  language_desc:
    en: Choose the interface language. Follow system uses your desktop locale.
    zh-CN: 选择界面语言；跟随系统时使用桌面语言设置。
  keyword_highlight_desc:
    en: Highlight lines containing matched keywords in the terminal.
    zh-CN: 终端输出命中关键词时整行高亮，便于扫读日志。
  cursor_shape_desc:
    en: Shape of the block cursor in the terminal.
    zh-CN: 终端光标的形状：方块、竖线或下划线。
  cursor_blink_desc:
    en: Blink the cursor when the terminal is idle.
    zh-CN: 终端空闲时光标按节奏闪烁。
  bold_is_bright_desc:
    en: Render bold text with the bright color variant.
    zh-CN: 粗体文字用亮色变体渲染，兼容老式终端程序的配色假设。
  scroll_on_input_desc:
    en: Scroll back to the bottom automatically when you type.
    zh-CN: 输入时自动滚回底部，避免被历史输出留在上面。
  right_click_action_desc:
    en: Paste directly, open the context menu, or open a menu whose first item pastes.
    zh-CN: 右键可直接粘贴、弹出上下文菜单，或弹出菜单并将"粘贴"作为首项。
  middle_click_paste_desc:
    en: Paste the primary selection with the middle mouse button.
    zh-CN: 用鼠标中键粘贴主选区（Linux 惯例）。
  copy_on_select_desc:
    en: Copy selected text to the clipboard immediately upon selection.
    zh-CN: 选中文字立即复制到剪贴板，无需再按快捷键。
  multiline_paste_desc:
    en: Ask for confirmation before pasting multi-line text.
    zh-CN: 粘贴多行文本前弹出确认，防止误粘贴整段命令。
  trim_trailing_whitespace_desc:
    en: Trim trailing whitespace from each line when pasting.
    zh-CN: 粘贴时去除每行末尾的空白字符。
  suppress_ctrl_v_desc:
    en: Swallow Ctrl+V in the terminal instead of sending ^V to the shell. A stray ^V arms readline quoted-insert, which turns the next bracketed paste into literal ^[[200~ leftovers and corrupts that command line. Pasting is unaffected (Ctrl+Shift+V, Cmd+V, right click). Turn this off to hand the key back to readline and vim block select, or bind another key to \x16 in custom key bindings.
    zh-CN: 默认开启：终端里的 Ctrl+V 被拦下，既不发给 Shell，也不当成粘贴。误按 Ctrl+V 会让 readline 布置一次性引用插入，紧接着的括号粘贴就留下 ^[[200~ 残字并污染那条命令行，拦下即从源头消除。粘贴不受影响，仍走 Ctrl+Shift+V、Cmd+V 或右键。需要 readline 引用插入与 vim 块选择时关闭本开关，或用自定义按键把别的组合（如 ctrl-q）绑成 \x16。
  show_tab_close_button_desc:
    en: Show the close button on each tab.
    zh-CN: 在每个标签页上显示关闭按钮。
  tab_position_desc:
    en: Show terminal tabs as a top bar, or as a left panel switched with the session tree.
    zh-CN: 终端标签显示为顶部的横向条，或左侧与会话树切换的面板。
  close_window_on_all_tabs_closed_desc:
    en: Quit the app when the last tab is closed.
    zh-CN: 关闭最后一个标签页时退出应用，而不是留一个空窗口。
  remember_window_bounds:
    en: Remember Window Size & Position
    zh-CN: 记忆窗口大小与位置
  startup_group:
    en: Startup
    zh-CN: 启动
  startup_tabs:
    en: Tabs On Launch
    zh-CN: 启动时打开
  startup_tabs_desc:
    en: Applies on next launch. Restoring reopens the groups and split layout from the last clean exit; New Local Terminal starts fresh instead of restoring, so no duplicate tab is added.
    zh-CN: 下次启动生效。恢复上次会按上次正常退出时的标签组与分屏形状重开；新建本地终端不叠加恢复结果，而是只开这一个，所以不会出现凭空多出的标签。
  startup_restore_last:
    en: Restore last tabs
    zh-CN: 恢复上次标签
  startup_empty:
    en: Empty workspace
    zh-CN: 空工作台
  startup_local:
    en: New local terminal
    zh-CN: 新建本地终端
  sidebar_startup:
    en: Session List Visibility
    zh-CN: 会话列表展开状态
  sidebar_startup_desc:
    en: Applies on next launch. Remember last keeps whatever you had when the app quit; Always show is the escape hatch for a list you collapsed once and never got back.
    zh-CN: 下次启动生效。记住上次沿用退出前的状态；选始终展开可摆脱“某次手动收起后每次都收起”，选始终收起则每次从工作台开始。
  sidebar_remember:
    en: Remember last
    zh-CN: 记住上次
  sidebar_show:
    en: Always show
    zh-CN: 始终展开
  sidebar_hide:
    en: Always hide
    zh-CN: 始终收起
  remember_window_bounds_desc:
    en: Restore window size and position from the last session.
    zh-CN: 重新打开时恢复上次关闭时的窗口尺寸和屏幕坐标。
  bell_style_desc:
    en: How the terminal rings when a bell event occurs.
    zh-CN: 终端响铃事件的提示方式：静默、屏幕闪烁或系统提示音。
  desktop_notifications_desc:
    en: Send desktop notifications for finished commands and OSC 777.
    zh-CN: 长命令完成与终端程序主动请求时发送系统桌面通知。
  terminal_follow_ui:
    en: Follow Interface Theme
    zh-CN: 跟随界面主题
  terminal_follow_ui_note:
    en: Terminal palette switches with the active interface theme; pick a preset below to override.
    zh-CN: 终端配色随当前界面主题联动（如 Islands Dark 配 Islands 终端色）；在下方选择预设即可覆盖。
  terminal_theme_note:
    en: Presets below override the theme-following palette; the choice applies to new sessions and, after saving, live panes.
    zh-CN: 下方预设会覆盖"跟随界面主题"的配色；选择应用于新会话，保存后立即作用于已打开的窗格。
  ui_font_family:
    en: Interface Font
    zh-CN: 界面字体
  ui_font_family_hint:
    en: Follow theme
    zh-CN: 跟随主题
  tab_files:
    en: Files & Editor
    zh-CN: 文件与编辑器
  editor_group:
    en: Built-in Editor
    zh-CN: 内置编辑器
  file_panel_group:
    en: File Panel
    zh-CN: 文件面板
  transfer_group:
    en: Transfer
    zh-CN: 传输
  editor_soft_wrap:
    en: Soft Wrap
    zh-CN: 软换行
  editor_soft_wrap_desc:
    en: Wrap long lines instead of scrolling horizontally.
    zh-CN: 长行折行显示，不出横向滚动条；查看日志时更友好。
  editor_line_numbers:
    en: Show Line Numbers
    zh-CN: 显示行号
  editor_line_numbers_desc:
    en: Show the line-number gutter in the built-in editor.
    zh-CN: 内置编辑器左侧显示行号栏。
  panel_hidden:
    en: Hidden Patterns
    zh-CN: 显示排除规则
  panel_hidden_hint:
    en: e.g. node_modules, *.log
    zh-CN: 例如 node_modules、*.log
  panel_hidden_note:
    en: One glob per line, matched against file names; only affects panel visibility, never transfers.
    zh-CN: 每行一条 glob 规则，按文件名匹配；只影响面板可见性，不会拦截传输任务。
  max_concurrent_transfers:
    en: Concurrent Transfers
    zh-CN: 并发传输上限
  max_concurrent_transfers_desc:
    en: Limit simultaneous upload and download tasks (1-16).
    zh-CN: 同时执行的上传与下载任务数上限（1~16）。
  verify_after_transfer:
    en: Verify After Transfer
    zh-CN: 传输后校验
  verify_after_transfer_desc:
    en: Compare checksums on both ends after each transfer to ensure data integrity.
    zh-CN: 每次传输完成后比对两端文件校验和，确保数据完整一致。
  checksum_algorithm:
    en: Checksum Algorithm
    zh-CN: 校验算法
  checksum_algorithm_desc:
    en: SHA-256 provides cryptographic integrity; MD5 offers high throughput and lower CPU usage for large files.
    zh-CN: SHA-256 提供强密码学完整性保证；MD5 吞吐更高且显著降低大文件校验 CPU 占用。
  checksum_sha256:
    en: SHA-256 (Secure)
    zh-CN: SHA-256（安全）
  checksum_md5:
    en: MD5 (Fast)
    zh-CN: MD5（高速）
  verify_mode:
    en: Verification Mode
    zh-CN: 校验模式
  verify_mode_desc:
    en: Full mode checks every byte; Quick Sample probes head/middle/tail blocks to verify multi-gigabyte files in sub-seconds.
    zh-CN: 完整模式逐字节校验；快速抽样探测头、中、尾采样块，超大文件亚秒级完成完整性验证。
  verify_mode_full:
    en: Full Check
    zh-CN: 完整校验
  verify_mode_quick:
    en: Quick Sample
    zh-CN: 快速抽样
  audit_group:
    en: Session Output Audit
    zh-CN: 会话输出审计
  identity_group:
    en: Credential Templates
    zh-CN: 凭据模板
  history_group:
    en: Command History
    zh-CN: 命令历史
  history_enabled:
    en: Collect commands and suggest them while typing
    zh-CN: 采集命令并在输入时给出建议
  history_enabled_desc:
    en: Requires shell integration that emits OSC 133 markers; commands are kept in ~/.config/transom/history.json and never leave the machine. Tab completes the top match.
    zh-CN: 需要能输出 OSC 133 标记的 shell 集成；命令存在 ~/.config/transom/history.json，不会离开本机。按 Tab 补全第一条建议。
  audit_enabled:
    en: Record session output to disk
    zh-CN: 将会话输出落盘记录
  audit_enabled_desc:
    en: Writes the raw output byte stream of every new connection into the audit directory. Off by default, because the log contains everything that appears on screen, including secrets typed back to it. Existing connections are not affected until they reconnect.
    zh-CN: 每个新建连接的终端原始输出按会话写入审计目录。默认关闭：日志会包含屏幕上出现过的全部内容（包括回显的口令）。已打开的连接需重连后才开始记录。
  audit_dir:
    en: Audit directory
    zh-CN: 审计目录
  audit_dir_desc:
    en: One file per connection, named after the session, host and start time. Files are never cleaned up automatically.
    zh-CN: 每次连接一个文件，名称由会话名、主机与开始时间组成；不会自动清理。
  audit_dir_open:
    en: Open folder
    zh-CN: 打开目录
  audit_revealed:
    en: Audit folder opened in the system file manager
    zh-CN: 已在系统文件管理器中打开审计目录
  zmodem_group:
    en: ZMODEM
    zh-CN: ZMODEM 文件传输
  zmodem_dir:
    en: Download Directory
    zh-CN: 下载目录
  zmodem_dir_desc:
    en: Where incoming rz/sz files are saved.
    zh-CN: 对端 sz 发来的文件保存位置。
  zmodem_dir_default:
    en: Follow system Downloads
    zh-CN: 跟随系统下载目录
  zmodem_dir_browse:
    en: Browse…
    zh-CN: 浏览…
  zmodem_auto_receive:
    en: Auto Receive (sz)
    zh-CN: 自动接收（sz）
  zmodem_auto_receive_desc:
    en: Accept incoming sz transfers automatically; disabled transfers are cancelled immediately.
    zh-CN: 对端发起 sz 下载时自动接收；关闭后检测到传输立即取消。
  alternate_scroll:
    en: Alternate Screen Scrolling
    zh-CN: 备屏滚轮翻页
  alternate_scroll_desc:
    en: In full-screen programs (vim, htop), translate the wheel into arrow keys.
    zh-CN: 在 vim、htop 等全屏程序里把滚轮转换为方向键发送给程序。
  sftp_panel_side:
    en: Panel Dock Side
    zh-CN: 工具面板停靠方向
  sftp_panel_side_desc:
    en: Where the SFTP and forwarding panels dock relative to the main pane.
    zh-CN: SFTP 与转发面板停靠在主面板的左侧或右侧；两个方向的列宽各自记忆。
  panel_side_left:
    en: Left
    zh-CN: 左侧
  panel_side_right:
    en: Right
    zh-CN: 右侧
  tab_appearance:
    en: Appearance
    zh-CN: 外观
  tab_terminal:
    en: Terminal
    zh-CN: 终端
  tab_window_layout:
    en: Window & Layout
    zh-CN: 窗口与布局
  tab_monitor:
    en: System Monitor
    zh-CN: 主机监控
  tab_containers:
    en: Containers & Registries
    zh-CN: 容器与镜像源
  container_registries_group:
    en: Image Registries
    zh-CN: 镜像仓库源
  container_registries_desc:
    en: Configure remote container registries for search, pull, and push (Docker Hub, Harbor, ACR).
    zh-CN: 配置用于镜像市场检索、拉取与推送的目标仓库源（Docker Hub、私有 Harbor、阿里云 ACR 等）。
  add_registry:
    en: Add Registry
    zh-CN: 添加镜像源
  edit_registry:
    en: Edit Registry
    zh-CN: 编辑镜像源
  registry_name:
    en: Display Name
    zh-CN: 仓库名称
  registry_name_placeholder:
    en: 'e.g. Company Harbor, Docker Hub'
    zh-CN: 例如 公司私有 Harbor、阿里云 ACR
  registry_url:
    en: Service URL
    zh-CN: 服务地址
  registry_url_placeholder:
    en: 'https://harbor.example.com'
    zh-CN: 例如 https://harbor.example.com
  registry_username:
    en: Username (Optional)
    zh-CN: 用户名（可选）
  registry_username_placeholder:
    en: Leave empty for anonymous access
    zh-CN: 留空表示匿名访问
  registry_password:
    en: Password / Token (Optional)
    zh-CN: 密码 / Token（可选）
  registry_password_placeholder:
    en: Password or access token
    zh-CN: 私有仓库访问密码或 Token
  registry_default:
    en: Set as Default Source
    zh-CN: 设为默认搜索源
  registry_default_desc:
    en: Automatically selected when opening the image market
    zh-CN: 打开镜像市场探索时优先默认选中该源
  registry_save:
    en: Save Registry
    zh-CN: 保存仓库
  registry_cancel:
    en: Cancel
    zh-CN: 取消
  registry_set_default:
    en: Set Default
    zh-CN: 设为默认
  registry_edit:
    en: Edit
    zh-CN: 编辑
  registry_delete:
    en: Delete
    zh-CN: 删除
  registry_official_tag:
    en: Built-in Official
    zh-CN: 预置官方
  registry_anonymous:
    en: Anonymous Access
    zh-CN: 匿名访问
  registry_auth_configured:
    en: 'Auth: %{user}'
    zh-CN: '认证账号: %{user}'
  registry_name_required:
    en: Registry display name is required
    zh-CN: 仓库名称不能为空
  registry_url_required:
    en: Registry service URL is required
    zh-CN: 仓库服务地址不能为空
  registry_secret_failed:
    en: 'Failed to save the registry password to the system keychain: %{error}'
    zh-CN: '保存镜像仓库密码到系统钥匙串失败: %{error}'
  monitor_sections_group:
    en: Default Section States
    zh-CN: 板块默认折叠状态
  monitor_behavior_group:
    en: Drawer & Sampling
    zh-CN: 抽屉与采样设置
  monitor_cpu_expanded:
    en: CPU Processor
    zh-CN: CPU 处理器板块
  monitor_cpu_expanded_desc:
    en: Expand CPU usage and load average section by default
    zh-CN: 开启监控抽屉时默认展开 CPU 使用率与平均负载
  monitor_memory_expanded:
    en: Memory & Swap
    zh-CN: 内存与交换分区板块
  monitor_memory_expanded_desc:
    en: Expand RAM and Swap usage section by default
    zh-CN: 开启监控抽屉时默认展开物理内存与 Swap 占用
