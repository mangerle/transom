[workspace]
members = [
    "apps/transom",
    "crates/transom-core",
    "crates/transom-store",
    "crates/transom-net",
    "crates/transom-terminal",
    "crates/transom-ui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[workspace.dependencies]
gpui-kit = "0.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "fs", "sync", "time", "macros", "process"] }
russh = "0.64"
russh-sftp = "3.0"
alacritty_terminal = "0.26"
portable-pty = "0.9"
flume = "0.12"
directories = "6"
keyring = "4.2"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
zeroize = "1"
async-trait = "0.1"
rust-i18n = "4.2"
rfd = "0.15"
notify-rust = "4"
chrono = "0.4"
globset = "0.4"
# 只启用缩略图解码需要的格式，与 gpui 已启用的图片能力保持一致；
# 不引入 AVIF 等额外编解码器，避免为悬停预览扩大编译与二进制体积。
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }
sha2 = "0.10"
serialport = { version = "4.10", default-features = false }
argon2 = "0.5"
chacha20poly1305 = "0.10"
base64 = "0.22"
getrandom = "0.3"
serde_yaml_ng = "0.10"
ssh-key = { version = "=0.7.0-rc.11", features = ["ed25519", "rsa", "encryption"] }
rand = "0.10"

transom-core = { path = "crates/transom-core" }
transom-store = { path = "crates/transom-store" }
transom-net = { path = "crates/transom-net" }
transom-terminal = { path = "crates/transom-terminal" }
transom-ui = { path = "crates/transom-ui" }

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
