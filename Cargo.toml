[workspace]
members = [
    "apps/transom",
    "crates/transom-core",
    "crates/transom-store",
    "crates/transom-net",
    "crates/transom-sync",
    "crates/transom-terminal",
    "crates/transom-ui",
]
resolver = "3"

[workspace.package]
version = "1.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
authors = ["wangle"]
repository = "https://github.com/mangerle/transom"
homepage = "https://github.com/mangerle/transom"
documentation = "https://github.com/mangerle/transom/tree/main/docs"
readme = "README.md"
# 桌面应用经 GitHub Release 分发，内部 crate 不单独发布；
# 置 false 后 cargo publish 直接拒绝，杜绝误把 workspace 成员推上 crates.io。
publish = false

[workspace.dependencies]
# 依赖重复的处置口径（`cargo tree -d` 会列出上百条，先分类再决定动不动）：
# - windows-* 的 0.4x/0.5x/0.6x 多版本只对非 Linux 目标生效，是平台库
#   各自锁定的范围，不做人工收敛；
# - RustCrypto 家族新旧两代并存：russh 0.64 与 ssh-key 0.7-rc 锁定了 RC 代
#   （rsa 0.10-rc、ed25519-dalek 3.0、aead 0.6），与工作区直接依赖的稳定代
#   （chacha20poly1305 0.10 / aead 0.5）跨 major 不可合并；只能随 russh /
#   ssh-key 转正升级，禁止用 `cargo update` 强行跨 major 统一；
# - GPUI 生态（gpui-pre/gpui-kit）内部的重复同样只能随上游。
# 定期维护命令与升级后门禁见 docs/runbook.md 的「依赖升级」一节。
# syntect 特性带来 gpui-component 的语法高亮后端（语法集由 two_face 随编译内置，
# 无需注册资产）；编辑远程配置文件需要它，未开启时 EditorState 只会退化为纯文本着色。
gpui-kit = { version = "0.8.0", features = ["syntect"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "fs", "sync", "time", "macros", "process"] }
russh = "0.64"
russh-sftp = "3.0"
alacritty_terminal = "0.26"
portable-pty = "0.9"
flume = "0.12"
directories = "6"
keyring = "4.2"
parking_lot = "0.12"
regex = "1"
# 日志统一走 log 门面：gpui/russh 等上游依赖本身就调用 log，接上门面后它们的内部
# 日志也会落进同一份文件，排查时不必再猜是应用没打还是上游没打。
log = "0.4"
# 输出分发（stderr + 自写按大小轮转的文件层）。只用它做分发与格式，不取任何
# 可选后端特性：轮转策略与保留份数由本项目自己实现，避免被第三方轮转语义绑住。
fern = "0.7"
futures = "0.3"
zeroize = "1"
async-trait = "0.1"
rust-i18n = "4.2"
rfd = "0.15"
notify-rust = "4"
chrono = "0.4"
globset = "0.4"
# 只启用缩略图解码需要的格式，与 gpui 已启用的图片能力保持一致；
# 不引入 AVIF 等额外编解码器，避免为悬停预览扩大编译与二进制体积。
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }
sha2 = "0.10"
# 云同步的 HTTPS 传输：关闭默认特性避免引入 native-tls，统一走 rustls；
# 连接池由 Client 内建，全局单例长生命周期复用。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# S3 SigV4 签名：与 sha2 同属 RustCrypto 家族的轻量 HMAC 封装，树内已有 0.12。
hmac = "0.12"
hex = "0.4"
serialport = { version = "4.10", default-features = false }
argon2 = "0.5"
chacha20poly1305 = "0.10"
base64 = "0.22"
getrandom = "0.3"
serde_yaml_ng = "0.10"
ssh-key = { version = "=0.7.0-rc.11", features = ["ed25519", "rsa", "encryption"] }
rand = "0.10"
# 单元测试写临时目录用的共享 dev-dependency：core/store/net 三处约束一致，
# 收敛到 workspace 段后升级只改一行，避免逐个清单漏改导致测试版本分叉。
tempfile = "3"

transom-core = { path = "crates/transom-core" }
transom-store = { path = "crates/transom-store" }
transom-net = { path = "crates/transom-net" }
transom-sync = { path = "crates/transom-sync" }
transom-terminal = { path = "crates/transom-terminal" }
transom-ui = { path = "crates/transom-ui" }

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

[profile.release]
strip = "symbols"
lto = "thin"
