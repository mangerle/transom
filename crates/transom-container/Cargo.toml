[package]
name = "transom-container"
description = "Docker/Podman engine discovery, REST client and interactive exec bridge for Transom."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
publish.workspace = true

[dependencies]
transom-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
tokio = { workspace = true, features = ["process"] }
flume.workspace = true
futures.workspace = true
globset.workspace = true
base64.workspace = true
# HTTP/1.1 直接跑在任意双向流上（unix socket / 命名管道 / 子进程 stdio），
# 并支持 exec 需要的 HTTP Upgrade。hyper 1 家族已由 reqwest 间接引入，
# 这里只是直接声明版本，不新增重复依赖树。
bytes = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# 容器归档 API 的 tar 解析与生成：流式读写，避免整目录读入内存。
tar = "0.4"
# inspect 返回的时间是 RFC3339 字符串，需要解析成 Unix 秒供界面排序/展示。
chrono.workspace = true
# TCP TLS 通信支持（连接启用 mTLS 鉴权的远端 Docker 引擎）。
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"

[dev-dependencies]
tempfile.workspace = true
