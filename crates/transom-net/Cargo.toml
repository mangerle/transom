[package]
name = "transom-net"
description = "russh SSH2 client, SFTP transfer, local/remote/SOCKS5 port forwarding, serial console, Telnet, and PTY plumbing for Transom."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
transom-core.workspace = true
tokio.workspace = true
russh.workspace = true
russh-sftp.workspace = true
flume.workspace = true
futures.workspace = true
zeroize.workspace = true
log.workspace = true
async-trait.workspace = true
sha2.workspace = true
serialport.workspace = true
# 编辑器非 UTF-8 文本的 GBK 兜底解码（锁内已有 0.8.42，无新增传递依赖树）。
encoding_rs = "0.8"
# HTTP CONNECT 代理 Basic 认证头的编码。
base64.workspace = true

[dev-dependencies]
parking_lot.workspace = true
ssh-key.workspace = true
tempfile.workspace = true
# 集成测试用真实 known_hosts 存储跑握手回环：仅测试依赖，生产依赖图
# 不包含存储层（net 只依赖 transom-core 的契约与 crypto 信封）。
transom-store.workspace = true
# ZMODEM 真机互操作测试：起 lrzsz 的 sz/rz 子进程需要伪终端（工作区既有依赖）。
portable-pty.workspace = true
