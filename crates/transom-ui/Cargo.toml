[package]
name = "transom-ui"
description = "GPUI front-end for Transom: session sidebar, tabs, nested splits, SFTP panes, settings center and bilingual i18n."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
publish.workspace = true

[dependencies]
ssh-key.workspace = true
rand.workspace = true
transom-platform.workspace = true
tokio = { workspace = true, features = ["sync"] }
serde_json.workspace = true
transom-core.workspace = true
transom-store.workspace = true
transom-terminal.workspace = true
gpui-kit.workspace = true
flume.workspace = true
rust-i18n.workspace = true
zeroize.workspace = true
rfd.workspace = true
directories.workspace = true
notify-rust.workspace = true
chrono.workspace = true
image.workspace = true
parking_lot.workspace = true
log.workspace = true
regex.workspace = true
# 保存前差异预览：与 gpui-component 的 diff 组件同源依赖（锁内已有 2.7.0），
# 用于生成统一 diff 文本交给 DiffState 渲染，不引入新的传递依赖树。
similar.workspace = true


[dev-dependencies]
tempfile.workspace = true
# 弹窗键位归属只能靠真实无头窗口跑出来：容器在 "Dialog" 上下文绑了
# escape→Cancel、enter→Confirm，输入框却自己吃按键，先后顺序决定
# "Input 用 Enter 提交、Textarea 用 Ctrl+Enter 提交" 能否成立。
# 这里直接给底层 gpui/gpui-base 开 test-support，不走 gpui-kit 的同名特性：
# 后者会把 gpui-fast-platform 拉进解析图，与锁内的 cocoa 版本硬 pin 冲突。
gpui-pre = { version = "=0.3.9", features = ["test-support"] }
gpui-base = { version = "=0.8.0", features = ["test-support"] }
gpui-component = { version = "=0.8.0", features = ["test-support"] }
