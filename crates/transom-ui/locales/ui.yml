    zh-CN: 使用 Argon2id 派生密钥，并通过 XChaCha20-Poly1305 认证加密保护内容。
  hint:
    en: The backup contains sessions and folders only. On import, sessions with the same ID are updated and the rest are appended. Only import backups from trusted sources, as sessions may contain automatic startup commands.
    zh-CN: 备份仅包含会话与文件夹配置；导入时同 ID 会话会被更新，其余会话追加。会话可能包含连接后自动执行的命令，请只导入可信来源的备份。
