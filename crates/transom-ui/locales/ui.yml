    en: Session Backup
    zh-CN: 会话备份
  settings_hint:
    en: Export all sessions and folders to a passphrase-encrypted JSON/YAML file. System keychain secrets are not included.
    zh-CN: 将全部会话与文件夹导出为口令加密的 JSON/YAML 文件；系统钥匙串中的密码不会包含在内。
  export_title:
