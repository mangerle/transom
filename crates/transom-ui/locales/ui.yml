    en: Include stored passphrases
    zh-CN: 包含已保存的口令
  include_secrets_hint:
    en: Writes the login passphrases and key passphrases from the system keychain into the backup file. Only do this for a destination you trust.
    zh-CN: 把系统钥匙串里的登录口令与私钥口令一并写入备份文件；请只写入你信任的存放位置。
