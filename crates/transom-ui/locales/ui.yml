    zh-CN: 项目主页
  about_homepage_open:
    en: Open homepage
    zh-CN: 打开主页
  about_config_dir:
    en: Config directory
    zh-CN: 配置目录
  about_config_dir_desc:
    en: Sessions, settings, themes, command history and audit logs all live under this folder.
    zh-CN: 会话、设置、主题、命令历史与审计日志都保存在这个目录下。
  about_dir_revealed:
    en: Config folder opened in the system file manager
    zh-CN: 已在系统文件管理器中打开配置目录
  tab_general:
