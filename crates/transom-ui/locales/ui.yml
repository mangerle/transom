    zh-CN: 清理历史日志
  log_cleanup_desc:
    en: Deletes only the rotated .1..N backups; the file being written now is left alone.
    zh-CN: 只删已经轮转出去的 .1..N 备份，正在写入的当前文件不动。
  log_cleanup_action:
    en: Clean up
    zh-CN: 立即清理
  log_cleanup_done:
    en: "Removed %{count} rotated log file(s)"
    zh-CN: "已清理 %{count} 份历史日志"
  tab_about:
