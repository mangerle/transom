    en: 1-3600. Nothing pops up while this window is focused and the command runs in the active tab; requests from programs (OSC 777) ignore the threshold. Requires shell integration that reports OSC 133.
    zh-CN: 可填 1~3600。窗口正被系统聚焦、且命令就在当前标签里跑完时不弹；终端程序主动请求的 OSC 777 通知不受阈值约束。命令耗时判定依赖上报 OSC 133 的 shell 集成。
