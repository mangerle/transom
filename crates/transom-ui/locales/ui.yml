    zh-CN: 外观与字体
  font_family:
    en: Primary Font (Latin and digits)
    zh-CN: 主字体（英文与数字）
  font_family_hint:
    en: Empty follows the app default monospace font
    zh-CN: 留空跟随应用默认等宽字体
  keyword_highlight:
    en: Highlight keywords in output
    zh-CN: 输出关键词自动高亮
  highlight_keywords:
    en: Custom keywords (comma or space separated)
    zh-CN: 自定义关键词（逗号或空格分隔）
  highlight_keywords_hint:
    en: e.g. timeout, OOM, connection refused
    zh-CN: 例如：timeout、OOM、连接失败
  highlight_keywords_note:
    en: Built-in rules colour ERROR / FATAL / WARN / INFO / DEBUG, IPv4 addresses and UUIDs. Built-ins match uppercase only; custom keywords ignore case. Up to 32 keywords.
    zh-CN: 内建规则为 ERROR / FATAL / WARN / INFO / DEBUG、IPv4 与 UUID 上色，只认大写形式；自定义关键词不区分大小写，最多 32 个。颜色取自当前主题的调色板槽位。
  selection:
    en: Selection
    zh-CN: 选词与选择
  word_separators:
    en: Word Separators (double-click)
    zh-CN: 双击选词分隔符
  word_separators_hint:
    en: Characters that break a word, e.g. - _ . /
    zh-CN: 出现在这些字符处即断开单词，例如 - _ . /
  word_separators_note:
    en: Space and tab count as separators if listed; the string is used verbatim. Applies to newly opened panes — the emulator fixes this at startup, and rebuilding it would drop scrollback.
    zh-CN: 字符串按原样使用：需要空格或制表符断词就得把它们写进来。改动只对之后新建的窗格生效——仿真内核在建立时固定该配置，重建会丢掉回滚历史。
  cjk_font:
    en: Second Font (Chinese, Japanese, Korean)
    zh-CN: 中文字体（独立渲染双格字符）
  cjk_font_hint:
    en: Empty falls back to system font substitution
    zh-CN: 留空交给系统字体回退
  cjk_font_note:
    en: CJK glyphs are scaled to exactly two cells, so any CJK font lines up; a proportional font may look squeezed.
    zh-CN: 中文字形会自动缩放到恰好两格宽，因此任意中文字体都能对齐；比例字体只是观感偏紧。
