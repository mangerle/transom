    zh-CN: 至少 8 个字符；口令遗失后备份将无法恢复。
  error_empty:
    en: Passphrase cannot be empty.
    zh-CN: 备份口令不能为空。
  error_short:
    en: Export passphrase must be at least 8 characters.
    zh-CN: 导出备份的口令至少需要 8 个字符。
  error_mismatch:
    en: The two passphrases do not match.
    zh-CN: 两次输入的口令不一致。
