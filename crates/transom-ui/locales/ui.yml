backup:
  title:
    en: Session Backup
    zh-CN: 会话备份
  settings_hint:
    en: Export all sessions and folders to a JSON/YAML backup file, optionally encrypted with a passphrase. Stored passphrases are only included when you ask for them.
    zh-CN: 将全部会话与文件夹导出为 JSON/YAML 备份文件，可选用口令加密；系统钥匙串中的口令仅在你勾选后才会写入。
