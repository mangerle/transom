[package]
name = "transom-core"
description = "Storage contracts, session and settings models, forwarding and highlight rules shared across Transom crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
publish.workspace = true

[dependencies]
transom-platform.workspace = true
# 日志门面：只为把设置里的级别映射成 `log::LevelFilter`，
# 也让 core 在需要时能与上层打到同一条链路上。
log.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["sync"] }
zeroize.workspace = true
globset.workspace = true
similar.workspace = true
# 云同步目标（WebDAV/S3）是异步契约，UI 测试与 net 实现要共用同一个 trait 形状。
async-trait.workspace = true

[dev-dependencies]
tempfile.workspace = true
